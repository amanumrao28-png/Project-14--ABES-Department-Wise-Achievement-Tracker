services:
  postgres:
    image: postgres:16-alpine
    container_name: abes_achievement_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: abes_achievement_tracker
    volumes:
      - abes_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abes_achievement_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  abes_pg_data:
